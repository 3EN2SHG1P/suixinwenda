name: 功能建议
description: 提出一个新功能、改进点或使用体验上的想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先扫一眼 `README.md` 的「已知限制」与 `CHANGELOG.md` 的「Unreleased」一节，
        有些想法可能已经在计划里、或是刻意保留的边界（例如本项目只做本机单人使用）。
        **不要贴 API Key、数据库口令、内网地址与个人隐私。**
        安全漏洞请走 `SECURITY.md` 里的私密渠道，不要开公开 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 说场景和痛点，不用先想方案——「我在做什么时卡住了」比「请加一个按钮」信息量更大。
      placeholder: |
        我在用附件提问读长文档时，需要……
        现在只能……，期望能……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的做法
      description: 具体到界面位置、操作步骤或配置项更好；不确定怎么实现也没关系。
      placeholder: |
        在 设置 → 模型 里增加一个开关，用于……
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
      description: 现在是怎么绕过这个问题的（如果有）。这能帮助判断值不值得做。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options:
        - 对话与流式渲染
        - 记忆与上下文
        - 历史会话
        - 附件与文件提问
        - 模型配置
        - 桌面端界面与交互
        - 安装、打包与更新
        - 文档
        - 其他 / 说不好
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 里可以看到；开发态可留空。
      placeholder: 0.1.0
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已看过 README 的「已知限制」，这个需求不在明确边界之内
          required: true
        - label: 我愿意自己提 PR 实现这个功能（可选）
          required: false
