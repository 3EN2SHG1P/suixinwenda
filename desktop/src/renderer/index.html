<!DOCTYPE html>
  <!-- 文件：desktop/src/renderer/index.html 职责：桌面端界面骨架——标题栏 / 侧栏（新对话 + 搜索 + 会话分组列表 + 账号）/ 主区（会话标题 + 消息流 + 输入坞）/ 弹窗与提示条；元素 id 是 renderer/app.js 的唯一选择器来源，改 id 必须同步改 app.js。 -->

  <html lang="zh-CN" data-theme="light" data-sidebar="expanded">
    <head>
      <meta charset="UTF-8" />
      <!-- CSP：连接只放行本机回环（后端只跑在 127.0.0.1，不允许把令牌带去外部主机），脚本只允许本地文件，样式允许内联（界面用 style 属性做动态高度） -->
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:* http://localhost:*; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none'" />
      <title>随心问答</title>
      <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
      <!-- 1. 标题栏（44px：左品牌区与侧栏同宽同底 + 拖动区 + 系统按钮） -->
      <header class="titlebar">
        <div class="titlebar-left">
          <span class="brand-logo">
            <img src="assets/logo-mark.png" alt="随心问答" draggable="false" /></span>
          <span class="brand-name">随心问答</span>
        </div>
        <div class="titlebar-drag" aria-hidden="true"></div>
        <div class="titlebar-controls">
          <button id="btn-minimize" class="win-btn" type="button" title="最小化" aria-label="最小化">&#8211;</button>
          <button id="btn-maximize" class="win-btn" type="button" title="最大化" aria-label="最大化">
            <span class="win-icon-max"></span></button>
          <button id="btn-close" class="win-btn win-btn-close" type="button" title="关闭" aria-label="关闭">&#215;</button>
        </div>
      </header>

      <!-- 2. 主体：侧栏（272px）+ 主区 -->
      <div class="app-body">
        <aside class="sidebar">
          <!-- 内层固定宽度：收起时外层宽度归零、内容被裁切，不参与重排（文字才不会被挤成两行） -->
          <div class="sidebar-inner">
          <div class="sidebar-head">
            <button id="btn-new-chat" class="btn-new-chat" type="button">
              <svg class="icon-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>新对话</button>
          </div>

          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.2-3.2" /></svg>
            <input id="input-search" class="search-input" type="text" placeholder="搜索会话" aria-label="搜索会话" />
          </div>

          <nav id="session-list" class="session-list" aria-label="会话列表">
            <p id="session-empty" class="session-empty">还没有对话</p>
          </nav>

          <div class="sidebar-footer">
            <!-- 底栏一行：账号（头像 + 昵称 + 一句存储口径）+ 设置齿轮（效果图第 1/2 屏） -->
            <div class="side-user">
              <div id="user-card" class="user-card" role="button" tabindex="0" title="管理账号">
                <span id="user-avatar" class="avatar">访</span>
                <span class="user-meta">
                  <span id="user-name" class="user-name">未登录</span>
                  <i id="user-sub" class="user-sub">会话存于你的数据库</i>
                </span>
                <!-- 未登录时只是卡片里的「登录 ›」提示，整张卡片就是入口：不再并排两个同义按钮 -->
                <span id="login-hint" class="login-hint">登录</span>
              </div>
              <button id="btn-settings" class="icon-btn" type="button" title="设置" aria-label="设置">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3.2" />
                  <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" /></svg>
              </button>
            </div>
            <!-- 账号菜单：从用户卡片弹出，避免侧栏底部堆一排同权重的文字按钮 -->
            <div id="user-menu" class="user-menu" hidden>
              <button id="btn-rename-user" class="user-menu-item" type="button">修改昵称</button>
              <button id="btn-logout" class="user-menu-item" type="button" hidden>退出登录</button>
            </div>
          </div>
          </div>
        </aside>

        <!-- 侧栏拖拽边界（sash）：绝对定位、不占 flex 宽度；悬停显线，拖动改宽，双击复位 -->
        <!-- 不加 title：原生提示框会在悬停 1 秒后盖出一条白色气泡，正好挡住那条线 -->
        <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical"
          aria-label="调整侧栏宽度，双击恢复默认" aria-valuemin="200" aria-valuemax="360" aria-valuenow="272"
          tabindex="0"></div>

        <main class="main-area">
          <!-- 3. 主区顶部条：侧栏开关 + 当前会话标题 + 记忆 / 主题（连接状态已移到设置「连接」页） -->
          <div class="main-top">
            <div class="top-left">
              <!-- 收起 / 展开键占同一格：展开态显示「收起」，收起态显示「展开」，交叉淡入淡出，
                   标题不会因为多一个常驻按钮而整体右移 -->
              <button id="btn-sidebar-collapse" class="icon-btn top-collapse" type="button" title="收起侧栏（Ctrl+B）" aria-label="收起侧栏">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="3" />
                  <path d="M9 4v16M16 9l-3 3 3 3" /></svg>
              </button>
              <button id="btn-sidebar-expand" class="icon-btn top-toggle" type="button" title="展开侧栏（Ctrl+B）" aria-label="展开侧栏">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="3" />
                  <path d="M9 4v16M14 9.5L16.5 12 14 14.5" /></svg>
              </button>
              <h1 id="chat-title" class="chat-title">新对话</h1>
            </div>
            <div class="top-right">
              <button id="btn-memory" class="icon-btn" type="button" title="查看对话历史" aria-label="查看对话历史">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
              </button>
              <button id="btn-chat-search" class="icon-btn" type="button" title="在对话里搜索（Ctrl+F）" aria-label="在对话里搜索">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" />
                  <path d="M20 20l-3.2-3.2" /></svg>
              </button>
              <button id="btn-theme" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
              </button>
              <!-- 更多：放不进图标的次要动作，不占常驻视觉 -->
              <div class="more-wrap">
                <button id="btn-more" class="icon-btn" type="button" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none" /></svg>
                </button>
                <!-- 分两组：上面是「整段对话级」的次要动作，下面是全局入口（常驻按钮之外的快捷入口） -->
                <div id="more-menu" class="more-menu" role="menu" hidden>
                  <button class="more-item" type="button" role="menuitem" data-more="copy-all">复制整段对话</button>
                  <button class="more-item" type="button" role="menuitem" data-more="export-md">导出为 Markdown</button>
                  <div class="more-sep" role="separator"></div>
                  <button class="more-item" type="button" role="menuitem" data-more="memory">对话历史</button>
                  <button class="more-item" type="button" role="menuitem" data-more="settings">设置</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 3a. 会话内搜索：Ctrl+F 打开，只高亮命中不重建 Markdown -->
          <div id="chat-search" class="chat-search" hidden>
            <input id="chat-search-input" class="chat-search-input" type="text" placeholder="在当前对话里搜索（Enter 下一处）"
              aria-label="在当前对话里搜索" />
            <span id="chat-search-count" class="chat-search-count">0 处</span>
            <button id="chat-search-prev" class="chat-search-btn" type="button" title="上一处" aria-label="上一处">&#8593;</button>
            <button id="chat-search-next" class="chat-search-btn" type="button" title="下一处" aria-label="下一处">&#8595;</button>
            <button id="chat-search-close" class="chat-search-btn" type="button" title="关闭搜索" aria-label="关闭搜索">&#215;</button>
          </div>

          <!-- 4. 消息区：空状态（大标题 + 存储徽标 + 三张任务卡）与消息流；末尾的「回到底部」只在用户上滑阅读时出现 -->
          <div class="message-wrap">
            <!-- 3b/3c 横幅贴在消息区顶部、不占布局：出现或消失都不会让下面的内容上下跳 -->
            <div id="offline-banner" class="offline-banner" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v5M12 16.5v.01" /></svg>
              <span id="offline-text" class="offline-text">后端连接失败，正在自动重连…</span>
              <button id="btn-offline-retry" class="offline-retry" type="button">立即重试</button>
            </div>

            <div id="model-banner" class="offline-banner model-banner" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v5M12 16.5v.01" /></svg>
              <span class="offline-text">还没有可用的模型，先去添加一个再开始对话</span>
              <button id="model-banner-open" class="offline-retry" type="button">去添加模型</button>
            </div>

            <div id="message-list" class="message-list" role="log" aria-label="消息列表"></div>

            <section id="empty-state" class="empty-state">
                <h1 class="empty-title">随时随地，<em>随心问答</em>。</h1>
                <!-- 徽标随存储类型切换：本机数据 / 本机 MySQL / 远程数据库（文案见 docs/页面设计规范.md 的 P0 首页） -->
                <span id="empty-badge" class="empty-badge is-local">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <path d="M9 11.5l2 2 4-4" /></svg>
                  <span id="empty-badge-text">数据存本地，使用更安心</span>
                </span>
                <div class="empty-cards">
                  <button class="empty-card" type="button" data-fill="帮我讲清一个概念：向量数据库是什么，配个例子">
                    <span class="empty-card-ico">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
                    </span>
                    <b>讲清一个概念</b>
                    <span>把复杂的东西讲成人话，配例子</span>
                  </button>
                  <button class="empty-card" type="button" data-fill="帮我读一份文档，提炼要点、结构与潜在风险">
                    <span class="empty-card-ico">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z" />
                        <path d="M14 2v5h5" /></svg>
                    </span>
                    <b>读一份文档</b>
                    <span>提炼要点、结构与潜在风险</span>
                  </button>
                  <button class="empty-card" type="button" data-fill="帮我把这段话改一版，换成汇报口吻，突出关键数字">
                    <span class="empty-card-ico">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
                    </span>
                    <b>改一版文字</b>
                    <span>换成汇报口吻，突出关键数字</span>
                  </button>
                </div>
            </section>

            <button id="btn-scroll-bottom" class="scroll-bottom" type="button" hidden>回到底部</button>
          </div>

          <!-- 5. 输入坞：附件条 + 工具栏（模型 / 附件 / 连接 / 字数）+ 输入行（自增高 + 发送） + 免责提示 -->
          <div class="composer">
            <div class="input-box">
              <!-- 待发附件列表：卡片由 app.js 的 renderAttachments 动态生成（支持一次多选），放在输入坞内部顶部 -->
              <div id="attach-bar" class="attach-bar" hidden></div>
              <div class="composer-input">
                <textarea id="input-message" class="input-message" rows="1" placeholder="发消息…（Enter 发送，Shift + Enter 换行）"></textarea>
                <button id="btn-send" class="btn-send" type="button" title="发送" aria-label="发送" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 19V5M5 12l7-7 7 7" /></svg>
                </button>
              </div>

              <!-- 工具行在输入行下方：附件 → 模型 → 字数（效果图 1:1） -->
              <div class="composer-tools">
                <button id="btn-attach" class="tool-pill is-icon-only" type="button" title="上传附件（图片 / 文档）" aria-label="上传附件">
                  <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" /></svg>
                </button>
                <span class="tool-sep" aria-hidden="true"></span>
                <div id="select-model" class="model-select" tabindex="0" role="combobox" aria-haspopup="listbox"
                  aria-expanded="false" aria-controls="model-select-list" aria-label="选择模型" title="选择模型">
                  <span id="model-select-label" class="model-select-label">默认模型</span>
                  <span class="model-select-arrow" aria-hidden="true"></span>
                  <ul id="model-select-list" class="model-select-list" role="listbox" hidden></ul>
                </div>
                <span id="counter" class="counter">0 / 4000</span>
                <span id="conn-text" class="conn-text is-unknown" title="点击重新检测后端连接" role="button" tabindex="0">离线</span>
              </div>
            </div>

            <p id="disclaimer" class="disclaimer">内容由 AI 生成，请注意甄别</p>
          </div>
        </main>
      </div>

      <!-- 6. 全局提示条 / 会话右键菜单 -->
      <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <div id="session-menu" class="session-menu" role="menu" aria-label="会话操作" hidden>
        <button id="session-menu-rename" class="session-menu-item" role="menuitem" type="button">重命名</button>
        <button id="session-menu-delete" class="session-menu-item" role="menuitem" type="button">删除</button></div>

      <!-- 6b~9. 预览 / 确认 / 重命名 / 登录 / 昵称 / 模型 / 保存 / 恢复 / 设置 / 存储 全部是独立窗口（renderer/views/*.js），主窗口不再有遮罩层 -->

      <!-- 10. 对话历史：独立子窗口（renderer/views/memory.js），主窗口这里不再有遮罩 -->

      <script src="lib/markdown.js"></script>
      <script src="lib/stream-blocks.js"></script>
      <script src="lib/sse.js"></script>
      <script src="lib/session-page.js"></script>
      <script src="ui-bits.js"></script>
      <!-- 设置 / 备份 / 恢复 / 模型 / 存储的界面全部在独立窗口（renderer/views/*.js），
           主窗口不再加载 storage.js / models.js / settings-pane.js，避免同一套表单有两份实现 -->
      <script src="connection.js"></script>
      <script src="app.js"></script>
    </body>
  </html>
